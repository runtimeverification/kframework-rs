[workspace]
resolver = "2"

members = [
    "kframework_core",
    "kframework_ffi",
]

exclude = [
    "examples/fuzzer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[workspace.dependencies]
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
indoc = "2.0.5"
