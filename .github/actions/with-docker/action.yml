name: 'With Docker'
description: 'Start a Docker container with the development environment set up'
inputs:
  container-name:
    description: 'Docker container name to use'
    required: true
    type: string
  dockerfile:
    description: 'Dockerfile to use'
    required: true
    type: string
  workdir:
    description: 'Work directory for the container'
    required: true
    type: string
runs:
  using: 'composite'
  steps:
  - name: 'Set up Docker'
    shell: bash {0}
    run: |
      set -euxo pipefail

      CONTAINER_NAME=${{ inputs.container-name }}
      TAG=runtimeverificationinc/${CONTAINER_NAME}
      DOCKERFILE=${{ github.action_path }}/${{ inputs.dockerfile }}

      docker build .         \
        --file ${DOCKERFILE} \
        --tag ${TAG}

  - name: 'Run Docker container'
    shell: bash {0}
    run: |
      set -euxo pipefail

      CONTAINER_NAME=${{ inputs.container-name }}
      TAG=runtimeverificationinc/${CONTAINER_NAME}
      WORKDIR=${{ inputs.workdir }}

      docker run                 \
        --name ${CONTAINER_NAME} \
        --rm                     \
        --interactive            \
        --tty                    \
        --detach                 \
        --user root              \
        --workdir ${WORKDIR}     \
        ${TAG}

      docker cp . ${CONTAINER_NAME}:${WORKDIR}
      docker exec ${CONTAINER_NAME} chown -R user:user ${WORKDIR}
