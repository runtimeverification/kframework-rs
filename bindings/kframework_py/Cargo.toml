# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "kframework_py"
crate-type = ["cdylib"]

[dependencies]
kframework = { path = "../../kframework", features = ["python"] }
pyo3 = { workspace = true }
